<body><div class="app" id="app"><header class="header"><div class="brand"><svg viewBox="0 0 40 44" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M20 2 37 12v20L20 42 3 32V12Z M3 12l17 10 17-10 M20 22v20 M11 8l17 10"/></svg>AI科学社<small>武汉市吴家山中学</small></div><nav class="toolbar" aria-label="课件工具"><button class="menu" id="menuBtn">☷ 目录</button><button id="notesBtn">讲稿</button><button id="sourcesBtn">资料</button><button id="motionBtn" class="motion-btn" aria-pressed="true">动画 开</button><button id="fullBtn">全屏 ↗</button></nav></header><div class="layout"><nav class="rail" aria-label="章节"><button data-go="0" title="序章">01</button><button data-go="2" title="模型的基础">02</button><button data-go="7" title="语言与计算">03</button><button data-go="15" title="上下文与提示">04</button><button data-go="19" title="从对话到行动">05</button><button data-go="23" title="理解整个系统">06</button></nav><main id="stage" class="stage" tabindex="-1" aria-label="课件内容"></main></div><footer class="footer"><span class="foot-label" id="chapterName"></span><div class="dots" id="dots" aria-label="页码导航"></div><div class="page-controls"><span class="shortcut">← → 翻页 · F 全屏</span><button class="round" id="prev" aria-label="上一页">←</button><span class="page-number" id="counter"></span><button class="round" id="next" aria-label="下一页">→</button></div></footer></div><dialog class="dialog" id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="round" id="closeDialog" aria-label="关闭">×</button></div><div class="dialog-body" id="dialogBody"></div></dialog><div id="blank" class="blank" role="button" tabindex="0" aria-label="退出空白屏幕"></div><div class="sr-only" id="announcement" aria-live="polite"></div><script>const NOTES=["封面\n【上屏文字，仅保留以下四项】\n从 LLM 到智能体，AI的发展\nAttention Is All You Need\n2017 · 浪潮的开端\n武汉市吴家山中学 AI科学社\n【教师备注】2017 指 Transformer 浪潮的关键起点，不是人工智能诞生的年份。此句不额外放到封面。", "今天，我们弄懂三个问题\n【上屏文字】\n它怎么处理信息？\nLLM · Token · Context · Context Window\n我们怎么告诉它怎么做？\nPrompt · User Prompt · System Prompt\n它怎么真正行动？\nTool · MCP · Agent · Agent Skill\n【演示】三组问题依次出现；不再出现项目案例或“今天要做一个……”的任务。", "LLM：能处理和生成语言的模型\n【上屏文字】\nLLM = Large Language Model = 大语言模型\nLarge：通常具有大规模参数，并通过大量数据训练。\nLanguage：主要学习与处理语言，也能处理代码等具有结构的文本。\nModel：通过训练得到的数学模型。\nLLM 能够处理和生成语言，包括回答、解释、翻译、总结和续写。\n【讲解】LLM 是模型，ChatGPT 等是使用模型的应用或服务。今天还有在语言能力基础上处理图像、音频等信息的多模态模型。“大”没有统一的参数门槛，也不意味着参数越多就必然越好。", "从识别信息，到生成内容，再到执行任务\n【上屏时间线】\n2012｜AlexNet：深度学习在图像识别上取得突破，数据、GPU 与算法共同发挥作用。\n2016｜AlphaGo：深度学习与搜索、强化学习结合，在围棋上取得标志性突破。\n2017｜Transformer：《Attention Is All You Need》提出新的序列建模架构。\n2020｜GPT-3：展示大规模语言模型通过提示与少量示例完成多种任务的能力。\n2022｜ChatGPT：对话式生成 AI 进入大众视野。\n2023｜GPT-4：语言任务与图像理解能力继续发展；工具与智能体应用开始受到更多关注。\n2024｜DeepSeek-V3、MCP：模型效率与开放生态继续发展，连接外部能力也逐渐标准化。\n2025｜DeepSeek-R1、GPT-5：推理能力成为重要发展方向，模型进一步用于复杂任务。\n2026｜GPT-6 系列、Claude Opus / Fable、Kimi K3、DeepSeek-V4 / V4.1：多模态、长上下文、工具使用与效率持续演进。\n【讲解】这是一组代表节点，不是单一产品的升级路线。AlphaGo 也不是 LLM。重点是能力变化，不要求背诵所有模型名称。\n【演示】一条时间线，2025、2026 点击后展开；当前型号放在展开层：GPT-6.1 Sol、Claude Opus 5.5、Claude Fable 5.1、Kimi K3、DeepSeek-V4.1-Flash。\n【核对】DeepSeek-R1 发布于 2025-01-20；DeepSeek-V4 预览版为 2026-04-24；V4.1-Flash 为 2026-09-10。Kimi K3 已有官方仓库与技术报告。口述“Open Cloud / Opsen”按 Anthropic / Claude Opus 校正；尚未确认的“1E”不擅自写成确定型号。“Flash”暂以已核实的 DeepSeek 系列举例，并不推定用户说的就是这一家。", "人工智能的三驾马车\n【上屏文字】\n数据：用什么学习？提供文字、代码、图像等学习材料。\n算力：靠什么计算？提供训练和运行模型所需的计算资源。\n算法：怎样学习和计算？决定模型结构、训练方法与推理过程。\n数据、算力和算法共同作用，形成模型能力。\n【演示】三个区域共同连接到中央的“模型”；依次点亮“材料”“计算资源”“方法”。\n【讲解】沿用 PDF 的三驾马车框架，但不使用“三者简单相乘就等于智能”的公式。GPU 是算力设备的一类；Transformer 是模型架构；Spark 是数据处理框架，不能混为同一类算法。", "数据：AI从什么材料中学习？\n【左侧：更新后的模型规模与训练数据图】\n使用同目录“模型规模与训练数据-2026-10-11.png”，在 HTML 中分三步展开，避免一次展示整张信息密集的图。\n总参数量公开示例：GPT-3 175B；DeepSeek-V3 671B；DeepSeek-V4-Flash 284B；DeepSeek-V4-Pro 1,600B；Kimi K3 2,800B。\n预训练 Token：GPT-3 0.3T；DeepSeek-V3 14.8T；DeepSeek-V4 两款模型均超过 32T；DeepSeek-V4.1-Flash 45T（多模态）。\nV4.1-Flash 按其模型卡单列：552B 主干参数；输入阶段激活 8B、输出阶段激活 16B。主干参数口径不直接混入总参数柱图。\nGPT-4、GPT-5、GPT-6 系列、Claude Opus 5.5 / Fable 5.1：所查官方资料未披露可核对的完整参数量和完整训练语料规模，不填传闻。\n【右侧：语料来源示意】\n网页与百科；书籍、论文等知识文献；代码与技术文档；人工编写或标注的数据；授权数据；经过筛选和验证的合成数据。\n多模态模型还可能使用图像、音频和视频。具体来源、许可和比例因模型而异。\n【上屏关键句】\n数据不只是“多”：质量、覆盖面、去重和筛选同样重要。\n【讲解】参数是模型内部可学习的数值；Token 是模型处理的基本单元；GB / TB 是存储体积。不能混成一个“大”的指标。不同分词器和模态下，一个 Token 不对应固定字节数；模型权重文件的 GB 也不是训练语料的 GB。后面两页会详细解释 Token 与参数，本页只建立规模印象。\n【旧资料核查】\n1. PDF 中“GPT-4 1.8 万亿参数、约 20TB 训练数据”不是 GPT-4 技术报告公开确认的数据，删除确定性数字。\n2. “175B 参数、300B 训练 Token”是 GPT-3 原始论文中的规模，不能直接标成 ChatGPT / GPT-3.5。\n3. 语料池大小、训练实际采样次数、训练累计 Token 不是同一件事。例如 GPT-3 各语料来源的采样权重不等于语料池占比。\n4. 原图未提供足以逐柱核验的出处，因此不照搬全部旧柱状值。\n5. “某年数据必将耗尽”和“60% 合成数据”一类预测不作为已经发生的事实；改讲高质量数据的约束、筛选与合成数据的价值及局限。\n6. Kimi K3 的总参数与激活参数已核对；本次未取得可确认的完整预训练 Token / 语料 GB 数值，不补猜测。", "算力：为什么AI偏爱GPU？\n【左侧画面】NVIDIA 官方芯片或计算模块产品图，注明准确型号。可用 NVIDIA Grace Hopper CPU+GPU 模块图；若选此图，必须标注“Grace Hopper CPU+GPU 模块”，不能误标为单颗 H100 芯片，也不把它称作最新产品。\n【右侧系统结构】\n应用程序 / AI框架\n操作系统 + 驱动：管理资源，协调软件使用硬件\nCPU ↔ 内存 RAM：通用计算、控制流程、暂存运行数据\nCPU ↔ GPU ↔ 显存：并行执行大量计算，保存计算所需数据\n硬盘 / SSD ↔ 内存：长期保存程序、数据与模型文件\n【上屏文字】\nCPU：擅长通用控制与复杂流程。\nGPU：擅长把大量相似运算并行处理。\n神经网络包含大量矩阵运算，因此常由 GPU 加速。\n【演示】同一组乘加运算：一个示意队列逐批处理，另一组并行展开；明确只是并行概念示意，不暗示真实固定倍速，也不把 CPU 画成只能做一个任务。\n【讲解】显存容量、数据传输速度、芯片互联和软件同样重要。GPU 并没有取代 CPU，AI 也可以运行在 CPU、NPU、TPU 等设备上。操作系统是软件层，不是与 GPU 并列的一块芯片。", "Token：模型处理文本的基本单元\n【上屏文字】\nToken 是分词器把文本编码后，模型处理序列时使用的基本单元。\n一个 Token 不一定是一个汉字，也不一定是一个英文单词。\n【中英文同一故事】\n中文：雨停了，小猫走到门外。它看到一只小鸟，又跑了回去。\n英文：The rain stopped. A kitten went outside, saw a little bird, and ran back home.\n【真实拆分演示，o200k_base 编码】\n中文：［雨］［停］［了］［，小］［猫］［走］［到］［门］［外］［。］［它］［看到］［一］［只］［小］［鸟］［，又］［跑］［了］［回］［去］［。］\n共 22 个 Token。\n英文：［The］［ rain］［ stopped］［.］［ A］［ kitten］［ went］［ outside］［,］［ saw］［ a］［ little］［ bird］［,］［ and］［ ran］［ back］［ home］［.］\n共 19 个 Token，英文块开头的空格属于对应 Token。\n【演示】完整句子→彩色分块→逐块计数，中英文上下对照。以上数值已用 tiktoken 实际计算，HTML 不手工猜分词边界。此结果仅对应本示例与该编码，不能推导“英文一定更省 Token”，也不代表 GPT-6 等所有模型使用同样的分词方式。", "从文字到数字：Token ID、向量和位置\n【上屏流程】\n文字 → Token → Token ID → 向量表示 → 模型计算\n【真实编号示例，仍用 o200k_base】\n雨 → 53307；停 → 26853；了 → 4531。\n【讲解】Token ID 是词表中的编号，不是词义本身；模型进一步将 Token 映射为一串可计算的数值，即向量。句子中第几个 Token 是另一种信息，模型还需要处理顺序和位置。不能把 Token 编号说成“意思在空间里的坐标”。\n【演示】“雨”翻转成编号，再展开成一列向量格子；向量数字若为教学示意，明确标注“示意值”。下方另显示“序列位置 1、2、3”，与 Token ID 分开。", "GPT：把名字拆开\n【上屏文字】\nG — Generative：生成式，根据输入生成新的内容。\nP — Pre-trained：预训练，先通过大量数据学习通用规律。\nT — Transformer：一种神经网络架构，注意力机制是其关键组成部分。\n【讲解】GPT 是模型家族名称；ChatGPT 是应用。预训练之后，还可以进行指令微调、偏好优化、强化学习等后训练，让模型更适合对话与任务。", "先从一个熟悉的函数理解参数\n【上屏公式】y = ax + b\nx：输入；y：输出；a、b：两个参数。\n【演示】坐标系中画出直线。改变 a，斜率变化；改变 b，整体上移或下移。\n【讲解】当 a 不为 0 时，这是一次函数，不是一元二次函数；若写 y=ax²+bx+c 才是常见二次函数形式。这里是一条函数表达式，含两个参数，不是“两个函数”。", "从三个参数，到海量参数\n【上屏公式，分步出现】\nz = ax + by + c\n两个输入 x、y；三个参数 a、b、c；在三维坐标中是一张平面。\nz = w₁x₁ + w₂x₂ + … + wₙxₙ + b\n多个输入按不同权重参与计算。\nh = σ(Wx + b)\n大量这样的计算单元，经过多层连接与非线性变换，形成复杂神经网络。\n【关键句】参数量，是模型中可学习数值的数量；并不等于输入变量的数量。\n【演示】直线→三维平面→多个加权节点与层。教师讲清前两个公式；第三步只建立“很多可调数值共同计算”的直觉，不推导矩阵和非线性函数。\n【讲解】权重、偏置与嵌入矩阵等都可能包含可训练参数，具体模型并非每层都有偏置。LLM 也不是一个把所有输入直接相加的巨大一次函数。", "训练与使用：什么时候参数会改变？\n【上屏对照】\n训练：输入样本→预测→与目标比较→计算误差→调整参数→重复。\n推理：输入新问题→使用训练好的参数计算→生成输出。\n【演示】散点图上的直线逐渐贴近数据，a、b 数值变化；切换到“推理”后锁住 a、b，只改变 x。注明用拟合直线作简化类比。\n【讲解】正常聊天时，模型通常不会因为你发了一句话就立即修改全部权重。它可以利用当前上下文调整回答；产品保存的长期记忆也不等同于现场重新训练。", "Attention：哪些信息彼此相关？\n【上屏例句】小猫看见了一只鸟，它跑了回去。\n【上屏文字】理解一个位置的信息时，需要结合其他相关位置的信息。\nAttention 根据当前表示，计算不同位置之间的关联与信息组合。\n【演示】把“它”与“小猫”“鸟”等位置用不同粗细线连接，标注“注意力机制示意，不是真实模型测量值”。改变句子，连线随之改变。\n【讲解】注意力帮助模型利用上下文；不等于人类意识，也不保证代词指代或事实判断一定正确。Transformer 还包含前馈网络等结构，不只是几条连线。\n【回扣封面】2017 年的论文让这种架构成为后来许多模型的重要基础。", "LLM怎样生成一句回答？\n【上屏流程】\n已有内容 → 计算下一个 Token 的概率分布 → 按生成策略选择 → 加入已有内容 → 继续。\n【演示】“雨停了，小猫……”之后出现几种候选，再生成一个 Token。候选概率若使用演示数字，清晰标注“教学示意，非真实模型输出”。\n【关键句】语言流畅，不等于事实正确。\n【讲解】以常见自回归文本生成为例解释核心机制。它不是只看紧邻的前一个字，也不是从固定答案库抽取完整答案；训练使它学会了复杂的语言与任务模式。优化后的系统可能批量验证候选 Token，但不影响这里要建立的基本直觉。", "Context：这一次，它看到了什么？\n【上屏文字】\nContext = 上下文：模型本次处理任务时实际收到的信息。\n可能包括：系统规则、用户输入、被保留的对话、参考资料、工具说明与工具返回结果。\n【演示】几种信息卡片汇入一个“本次输入”容器。\n【讲解】模型训练时学到的内容、产品永久保存的信息、本次发送给模型的信息，是不同层次。资料放在电脑里或历史记录里，并不代表这一轮模型就一定看到了它。", "Context Window：它一次能处理多少？\n【上屏文字】\nContext Window = 上下文窗口：单次处理可容纳的 Token 容量上限。\n对话、资料、工具结果都会占用空间；生成答案也需要预算。\n【演示】一个容量条被各类输入逐步填满，并为回答留出空间；用“教学示意容量”展示，不冒充某型号的实际限制。\n【讲解】具体输入、输出、推理 Token 的计数规则随模型而异。超过限制时，应用可能报错、截断或压缩历史。窗口大不等于记忆永久，也不保证每处信息都能被准确利用。", "Prompt：怎样把意图交给模型？\n【上屏文字】\nPrompt = 提示内容：交给模型的指令、问题、背景或示例。\n说清目标：要它完成什么？\n提供必要信息：它需要依据什么？\n说明约束与输出：范围、格式、对象是什么？\n【演示】一条提示依次加入目标、背景、约束和格式，展示信息怎样变得明确；不安排学生练习。\n【讲解】Prompt 不只是神奇口令；它是上下文的重要组成部分，也不等于上下文的全部。", "User Prompt 与 System Prompt\n【上屏对照】\nUser Prompt：用户针对当前任务提出的要求。\nSystem Prompt：系统层设置的角色、规则与行为约束。\n【简短示例】\nSystem：你是一位面向高中生的讲解助手；术语出现时先解释；不确定的信息要说明。\nUser：请用 100 字解释什么是 Token。\n【讲解】同一个任务会同时受到不同层次信息影响，系统指令通常优先级更高；具体角色和优先级取决于平台，并非所有系统都只有这两种消息。系统提示是指导，不是绝对可靠的权限屏障。", "Tool：把“回答”连接到外部能力\n【上屏文字】\nTool = 工具：供程序调用的外部能力。\n搜索：获取新资料。\n计算器或代码运行器：执行计算。\n文件工具：读取或修改文件。\n浏览器、传感器接口：读取状态或执行操作。\n【上屏流程】\n模型提出工具调用 → 应用检查权限并执行 → 返回结果 → 模型继续处理。\n【讲解】模型发出调用请求，真正执行的是外部程序。说“我已经保存了文件”不等于文件真的已保存，要看工具执行结果。工具也可能失败，结果也需要核验。\n【演示】三列角色“模型—应用/工具—返回结果”，箭头依次点亮。", "MCP：连接外部能力的共同规范\n【上屏文字】\nMCP = Model Context Protocol = 模型上下文协议。\n它为 AI 应用连接外部工具、资源等提供共同的接口规范。\n【演示】左侧两个 AI 应用，右侧文件、数据源、工具服务；中间出现 MCP 连接层。以“统一接口”作类比，标注它是软件协议。\n【讲解】MCP 不是模型，不是一个万能工具，也不是智能体必需的唯一接入方式。它能减少重复适配，但服务仍需实现、配置与授权；不是用了 MCP 就自动能控制所有软件。除工具外，它还涉及资源、提示模板等能力。", "Agent：围绕目标持续决定下一步\n【上屏文字】\nAgent = 智能体：围绕目标，利用模型判断，并结合工具和环境反馈推进任务的系统。\n目标 → 判断下一步 → 调用工具 → 观察结果 → 调整 → 完成或停止。\n【演示】循环流程图；收到成功结果、失败结果后走向不同分支。\n【讲解】一次工具调用不必然构成完整智能体。关键是围绕目标，依据反馈反复选择下一步。预先写好每一步的流程与动态决策的智能体有所区别，实际产品常混合两者。它可能达到目标，也可能失败、暂停或需要人的帮助，不能写成“必定自主运行到成功”。", "Agent Skill：把做事方法交给智能体\n【上屏文字】\nAgent Skill = 智能体技能包：可复用的任务说明、方法与相关资源。\n可以包含：适用场景、操作步骤、检查规则、参考资料、模板和脚本。\n【演示】打开一个技能文件夹：SKILL.md + 可选 scripts / references / assets；再展示“需要时读取相应内容”。\n【讲解】Skill 可以规定做事步骤，也可以携带辅助程序与材料；不应只说成“一段系统提示词”。读取 Skill 通常不等于训练出新模型，也不会凭空获得原本没有的工具权限。", "这几个概念，各自负责什么？\n【上屏对照】\nLLM：处理信息、生成内容与参与判断。\nPrompt：表达本次要求或规则。\nContext：本次实际交给模型的信息。\nTool：提供可调用的外部能力。\nMCP：规定连接外部能力的一种共同方式。\nAgent：把判断、行动和反馈组织成目标导向的过程。\nSkill：提供可复用的方法、步骤与资源。\n【演示】先只显示核心模型，再逐层加入信息、工具、连接、循环和技能。不要画成所有智能体都必须依赖 MCP / Skill 的固定装配公式。", "怎样让智能体更有效？\n【上屏文字，参考 PDF 四个方向重新组织】\n更合适的模型：选择适合任务的能力，合理分配推理时间。\n更合理的流程：拆分、执行、检查和修正。\n更好的上下文：提供需要的知识、工具说明、记忆与技能。\n必要时的协作：不同角色分工，再汇总与核验。\n【讲解】保留原 PDF 的优化框架，但不把更多角色、更长思考、更大上下文自动等同于更好。多智能体只是可选方案，会增加协调成本。A2A、Harness 等扩展术语放教师备注，不加入本课必记概念。", "从能做，到做好：目标与边界\n【上屏文字】\n目标：什么结果才算完成？\n权限：允许它读取什么、修改什么？\n核验：结果用什么依据检查？\n成本：时间、计算与调用费用是否合适？\n【讲解】参考 PDF 的目标管理与权限、成本、时间取舍。能自主采取步骤不代表目标与责任可以完全交给它；任务系统需要明确的完成标准和停止条件。\n【演示】四个旋钮或刻度逐个出现，只说明取舍，不安排注册、授权或实操。", "回到最初的三个问题\n【上屏文字】\n怎么处理信息？文字被编码为 Token，经模型计算生成结果；可用信息受上下文与窗口限制。\n怎么告诉它怎么做？提示表达目标、背景、约束和规则，不同角色的提示共同影响行为。\n怎么真正行动？工具连接外部世界；智能体围绕目标使用工具、观察反馈；MCP 帮助连接，Skill 提供方法。\n从语言生成，到目标导向的行动。\n【备注】本课到此结束，不添加贯穿项目、动手任务、课后制作要求。"];

 if(type==='orbital'){ctx.fillStyle='#435d3d09';ctx.beginPath();ctx.ellipse(w/2,h*.82,w*.27,14,0,0,7);ctx.fill();const pts=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)pts.push([x,y,z]);pts.forEach((p,i)=>pts.forEach((q,j)=>{let d=p.reduce((s,v,k)=>s+Math.abs(v-q[k]),0);if(j>i&&d===1)line(proj(...p),proj(...q),'#71886655')}));pts.forEach((p,i)=>{let [x,y]=proj(...p);ctx.beginPath();ctx.arc(x,y,i===13?10:4,0,7);ctx.fillStyle=i===13?'#b79867':'#637c50';ctx.fill()});for(let k=0;k<3;k++){const rad=1.75+k*.22;let prev;for(let j=0;j<=100;j++){let a=j/100*Math.PI*2,p=proj(Math.cos(a)*rad,Math.sin(a)*rad*.7,Math.sin(a)*rad*.7);if(prev)line(prev,p,'#b4bea044');prev=p}let q=proj(Math.cos(t*.00025+k*2)*rad,Math.sin(t*.00025+k*2)*rad*.7,Math.sin(t*.00025+k*2)*rad*.7);ctx.beginPath();ctx.arc(...q,4,0,7);ctx.fillStyle='#a98b56';ctx.fill()}}
 else {let {a,b,c}=getParams();for(let i=-2;i<=2;i+=.4){let pts=[proj(i,a*i+b*-2+c,-2),proj(i,a*i+b*2+c,2)];line(...pts,'#57764780');line(proj(-2,a*-2+b*i+c,i),proj(2,a*2+b*i+c,i),'#57764780')}for(const [p,label]of[[[3,0,0],'x'],[[0,3,0],'z'],[[0,0,3],'y']]){line(proj(0,0,0),proj(...p),'#b19b75',1.5);ctx.fillStyle='#67795a';ctx.font='15px Georgia';ctx.fillText(label,...proj(...p))}}
 frame=requestAnimationFrame(draw)}frame=requestAnimationFrame(draw);const old=cleanup;cleanup=()=>{old();alive=false;cancelAnimationFrame(frame);ro.disconnect()}}

function corpusChart(mode=0){const proj=(x,y,z)=>[240+x*83+y*61,105+y*43-x*11-z*105];const poly=ps=>ps.map(p=>proj(...p).join(',')).join(' ');let s='';for(let y=0;y<=6;y++)s+=`<polyline points="${poly([[0,y,0],[5,y,0]])}" fill="none" stroke="#ced4c0"/>`;for(let x=0;x<=5;x++)s+=`<polyline points="${poly([[x,0,0],[x,6,0]])}" fill="none" stroke="#ced4c0"/>`;const maxz=2;for(let z=0;z<=maxz;z+=.5){const [x,y]=proj(0,0,z);s+=`<text x="${x-15}" y="${y+5}" text-anchor="end">${mode===1?z*1400:mode===2?z*250:'?'}</text>`}s+=`<polyline points="${poly([[0,0,2],[0,0,0],[5.6,0,0]])}" fill="none" stroke="#7c8f6a" stroke-width="2"/>`;const [zx,zy]=proj(0,0,2);s+=`<text x="${zx-100}" y="${zy-23}">${mode===1?'总参数 / B':mode===2?'语料池 / B Token':'训练语料 / GB'}</text>`;
for(let row=0;row<6;row++){let [lx,ly]=proj(-.15,row+.5,0);s+=`<text x="${lx-16}" y="${ly+6}" text-anchor="end" class="chart-model">${corpusModels[row]}</text>`;for(let col=0;col<5;col++){if(mode===1&&col>0)continue;let val=mode===1?[175,null,null,null,671,2800][row]:mode===2&&row===0?[3,12,55,19,410][col]:null,z=val==null?.35:val/(mode===1?1400:250);let x=col+.16,y=row+.16,w=.65,d=.65;let known=val!==null;s+=`<g class="chart-column ${known?'known':'unknown'}"><title>${corpusModels[row]} · ${mode===1?'总参数':mode===2?['Wikipedia','Books1','Books2','WebText2','Common Crawl'][col]:corpusSources[col]}：${known?val+(mode===1?'B 参数':'B Token'):'未披露可比数据'}</title><polygon points="${poly([[x,y,0],[x+w,y,0],[x+w,y,z],[x,y,z]])}" fill="${known?'#7c9564':'#f0eee5'}"/><polygon points="${poly([[x+w,y,0],[x+w,y+d,0],[x+w,y+d,z],[x+w,y,z]])}" fill="${known?'#536f44':'#e7e9de'}"/><polygon points="${poly([[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]])}" fill="${known?'#b4c69c':'#fbf7ef'}"/>${(()=>{const[a,b]=proj(x+.3,y+.3,z+.09);return `<text x="${a}" y="${b}" text-anchor="middle">${known?val:'?'}</text>`})()}</g>`}}
(mode===1?['总参数']:mode===2?['百科','书籍1','书籍2','网页精选','网页爬取']:corpusSources).forEach((n,i)=>{const[x,y]=proj(i+.5,6.55,0);s+=`<text class="chart-source" x="${x}" y="${y}" text-anchor="middle">${n}</text>`});return svgWrap(s,mode===1?'模型参数三坐标图，未披露值以问号标记':'模型、语料来源、数据量三坐标图，未知值不画成真实高度','80 -165 1000 620')}

function knownCorpus(){const pt=(x,y,z=0)=>[180+x*96+y*87,285+y*48-x*13-z*.54],poly=p=>p.map(v=>v.join(',')).join(' ');let body='';
 for(let z=0;z<=400;z+=100){let p=pt(0,0,z),q=pt(5,0,z);body+=`<path d="M${p}L${q}" stroke="#dce0d1"/><text x="${p[0]-14}" y="${p[1]+5}" text-anchor="end" font-size="17" fill="#6b7c5c">${z}</text>`}
 body+=`<text x="125" y="31" font-size="18" fill="#526b43">语料池体积 / GB</text>`;
 for(let r=0;r<3;r++)for(let c=0;c<5;c++){let v=corpusRows[r][2][c],a=pt(c+.08,r+.12),b=pt(c+.68,r+.12),d=pt(c+.08,r+.69),e=pt(c+.68,r+.69),A=pt(c+.08,r+.12,v),B=pt(c+.68,r+.12,v),D=pt(c+.08,r+.69,v),E=pt(c+.68,r+.69,v);body+=`<g class="corpus-bar" data-corpus="${r},${c}" tabindex="0" role="button" aria-label="${corpusRows[r][0]} ${corpusNames[c]} ${v.toFixed(1)} GB"><title>${corpusRows[r][0]}：${corpusNames[c]} ${v.toFixed(1)} GB</title><polygon points="${poly([d,e,E,D])}" fill="${['#9da984','#879c6e','#617e4f'][r]}"/><polygon points="${poly([a,d,D,A])}" fill="#526d42"/><polygon points="${poly([A,B,E,D])}" fill="#b9c7a0"/><text x="${E[0]-20}" y="${E[1]-10}" text-anchor="middle" fill="#385331" font-size="17">${Math.round(v)}</text></g>`}
 corpusRows.forEach(([n],r)=>{let p=pt(0,r+.55);body+=`<text x="${p[0]-12}" y="${p[1]+17}" text-anchor="end" fill="#526b43" font-size="16">${n}</text>`});corpusNames.forEach((n,c)=>{let p=pt(c+.5,3.12);body+=`<text x="${p[0]}" y="${p[1]+14}" text-anchor="middle" fill="#526b43" font-size="18">${n}</text>`});return svgWrap(body,'按2021、2022、2023时间顺序展示模型所用语料池中五类来源的GB体积','0 0 970 480')}
function totalsPanel(mode){let col=mode===1?2:3,max=mode===1?700:15,unit=mode===1?'B 参数':'T Token';return `<div class="timeline-bars">${scaleRows.map(([y,n,p,t])=>`<div class="timeline-bar"><span>${y}</span><b>${n}</b><div class="bar-track"><i style="width:${(mode===1?p:t)/max*100}%"></i></div><strong>${mode===1?p:t}<small>${unit}</small></strong></div>`).join('')}</div><div class="v3-facts"><p><b>${mode===1?'参数量：模型中可学习数值的数量。':'训练量：训练过程中处理的 Token 数量。'}</b><br>${mode===1?'DeepSeek-V3：671B 总参数，每个 Token 激活约 37B。':'同一份材料可以被多次读取；训练 Token 总量不等于语料池大小。'}</p><p>B = 十亿，T = 万亿。<br>按发布时间排序，不代表能力排名。</p></div>`}

function initDataV3(){const show=i=>{if(i){$('#dataPanel').innerHTML=totalsPanel(i)+note('来源：GPT-3、GPT-J、Chinchilla、LLaMA 原论文 / 模型卡与 DeepSeek-V3 官方仓库。参数与训练量采用各自公开口径。');return}$('#dataPanel').innerHTML=`<div class="corpus-layout"><div>${knownCorpus()}</div><div class="corpus-reading"><span class="label">悬停柱子，放大读数</span><div id="corpusRead" aria-live="polite"></div><p>只选公开分项数据的例子。<br>同一个语料池，可以训练不同模型。</p><button class="btn" id="dataTableOpen">查看数值与来源 ↗</button></div></div>${note('图中仅选五类来源，并非全部语料。The Pile 原始 GiB × 1.073741824 换算为 GB；LLaMA 使用论文 GB。书籍按来源合并；处理、语言覆盖不同，不代表内容完全相同。体积不是训练次数或 Token 数。')}`;const pick=(r,c)=>{$('#corpusRead').innerHTML=`<small>${corpusRows[r][0]}</small><h3>${corpusNames[c]}</h3><strong>${corpusRows[r][2][c].toFixed(1)} <em>GB</em></strong><span>${corpusRows[r][1]} · 采样前材料体积</span>`;$$('[data-corpus]').forEach(el=>el.classList.toggle('selected',el.dataset.corpus===`${r},${c}`))};$$('[data-corpus]').forEach(el=>{let [r,c]=el.dataset.corpus.split(',').map(Number);el.onpointerenter=el.onfocus=el.onclick=()=>pick(r,c)});pick(2,2);$('#dataTableOpen').onclick=()=>dialog('公开语料：数值和统计口径',`<div class="v3-table-wrap"><table class="v3-table"><thead><tr><th>模型 / 年份</th>${corpusNames.map(n=>`<th>${n} GB</th>`).join('')}</tr></thead><tbody>${corpusRows.map(([n,d,vs])=>`<tr><th>${n}</th>${vs.map(v=>`<td>${v.toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>百科指 Wikipedia；代码指 GitHub；论文指 arXiv；问答指 Stack Exchange。Pile 的书籍为 Books3 + Gutenberg (PG-19) + BookCorpus2；LLaMA 书籍为清理后的 Gutenberg + Books3。</p><p>GPT-J 与 GPT-NeoX 都使用 The Pile，因此展示相同的语料池来源体积。这不是两个模型各自实际读过的字节数。不同项目的清理方式、语言范围不同。</p>${v3Sources.slice(0,4).map(([n,u])=>`<p>${sourceLink(n,u)}</p>`).join('')}`)};bindTabs('#dataTabs',show);show(0)}

function emergenceSlide(){return `<div class="emergence-grid"><div class="scale-controls"><span class="label">拖动两个滑块 · 教学示意</span>${range('sizeScale','模型大小',1,100,38)}${range('dataScale','训练量',1,100,38)}<p>更大的模型提供更多可学习参数；充分训练让这些参数学到规律。<b>两者需要配合。</b></p><div class="controls">${btn('一起增加','scalePlay',true)}${btn('重置','scaleReset')}</div><small>滑块为相对刻度，不对应真实模型参数或训练 Token；图中不是实测定律。</small></div><div class="emergence-view"><div id="scalePlot"></div><div class="scale-reading"><span>连续表现示意 <b id="continuousScore"></b></span><span>按 70% 门槛评分 <b id="thresholdScore"></b></span></div><div class="growth-blocks" id="growthBlocks"></div></div></div><div class="v3-facts"><p><b>“突然会了”，可能有两种解释</b><br>规模增长带来复杂能力；评分只看“过 / 不过”，也会把连续进步显示成跳变。</p><p><b>真实例子：Chinchilla（2022）</b><br>70B 参数、1.4T Token，在相近训练算力下优于更大的 Gopher（280B、300B Token）的多项表现。不能只看模型大小。</p></div>${note('能力涌现仍有研究争论；没有通用于所有任务的“智能开关”，也不能据此推断意识。来源：Chinchilla、Wei 等（2022）、Schaeffer 等（2023），见“资料”。')}`}
function initEmergence(){let playing=false;const update=()=>{let a=+$('#sizeScale').value,b=+$('#dataScale').value,q=Math.sqrt(a*b)/100,p=.15+.8*q;['sizeScale','dataScale'].forEach(id=>$('#'+id+'Val').textContent=$('#'+id).value);let curve=[],step=[];for(let t=0;t<=100;t++){let x=60+5*t,y=250-200*(.15+.8*t/100);curve.push(`${x},${y}`);step.push(`${x},${250-(.15+.8*t/100>=.7?200:0)}`)}$('#scalePlot').innerHTML=svgWrap(`<path d="M60 40V250H585" stroke="#9ea78e" fill="none"/><path d="M60 110H575" stroke="#b89b70" stroke-dasharray="5 5"/><text x="65" y="100" fill="#997344" font-size="15">70% 评分门槛</text><polyline points="${step.join(' ')}" fill="none" stroke="#ba9b73" stroke-width="3"/><polyline points="${curve.join(' ')}" fill="none" stroke="#526e43" stroke-width="4"/><path d="M${60+500*q} 250V${250-200*p}" stroke="#526e43" stroke-dasharray="5 5"/><circle cx="${60+500*q}" cy="${250-200*p}" r="9" fill="#526e43"/><text x="65" y="27" font-size="17" fill="#526e43">表现示意 ↑</text><text x="320" y="287" font-size="17" text-anchor="middle" fill="#6f7963">规模与训练的共同增长 →</text>`,'连续变化与门槛评分的示意对比','0 0 620 310');$('#continuousScore').textContent=Math.round(p*100)+'%';$('#thresholdScore').textContent=p>=.7?'通过':'未通过';$('#thresholdScore').classList.toggle('passed',p>=.7);$('#growthBlocks').innerHTML=Array.from({length:20},(_,i)=>`<i class="${i<p*20?'lit':''}"></i>`).join('');$('#scalePlay').textContent=playing?'暂停增长':'一起增加'};$('#sizeScale').oninput=$('#dataScale').oninput=()=>{playing=false;update()};$('#scalePlay').onclick=()=>{if(+$('#sizeScale').value===100&&+$('#dataScale').value===100){$('#sizeScale').value=1;$('#dataScale').value=1}playing=!playing;update()};$('#scaleReset').onclick=()=>{playing=false;$('#sizeScale').value=38;$('#dataScale').value=38;update()};every(()=>{if(playing){['sizeScale','dataScale'].forEach(id=>$('#'+id).value=Math.min(100,+$('#'+id).value+1));if(+$('#sizeScale').value===100&&+$('#dataScale').value===100)playing=false;update()}},100);update()}

slides[24]=()=>`<div class="engineering-tabs">${engineering.map(([en,cn],i)=>`<button data-eng="${i}"><small>0${i+1} · ${en}</small><b>${cn}</b></button>`).join('')}</div><div class="engineering-demo"><div id="engArt"></div><div id="engCopy" aria-live="polite"></div></div><div class="optimization-four">${[['推理模型','o1、o3、DeepSeek-R1 等历史例子：为复杂任务分配更多推理计算。'],['工作流','先明确步骤与验收，让关键环节有人指导、有人检查。'],['知识与记忆','用知识库、工具、Skill 和记忆补充模型当下需要的信息。'],['多 Agent','分工合作，再交叉核验；同时管理沟通与成本。']].map(([n,d],i)=>`<div><span>0${i+1}</span><h3>${n}</h3><p>${d}</p></div>`).join('')}</div>${note('三种工程相互补充。更多推理、更多上下文、更多智能体，都需要任务评测来证明是否有效。')}`;
function initEngineering(){const pick=i=>{$$('[data-eng]').forEach((b,k)=>b.classList.toggle('active',i===k));let [en,cn,t,d,ex]=engineering[i];$('#engCopy').innerHTML=`<small>${en}</small><h3>${t}</h3><p>${d}</p><blockquote>${ex}</blockquote>`;$('#engArt').innerHTML=svgWrap(`<g transform="translate(245 75) scale(.82)">${robot(true)}</g>${i>=0?`<g class="eng-float">${toolCard('flag',60,50,'目标')}</g>`:''}${i>=1?`<g class="eng-float">${toolCard('book',410,50,'资料')}</g>`:''}${i>=2?'<path d="M140 225Q250 295 408 225M405 225l-16-5m16 5-7 14" stroke="#b39462" fill="none" stroke-width="4"/><text x="265" y="290" text-anchor="middle" fill="#647854" font-size="18">执行 → 核验 → 修正</text>':''}`,'逐步为智能体添加目标、上下文和执行反馈机制','0 0 600 315')};hoverSelect('[data-eng]',pick);pick(0)}
const loopSteps=[['明确目标','生成今天武汉的天气简报，日期和来源必须准确。'],['计划与调用','调用天气工具；把返回结果保存在当前任务状态中。'],['核验结果','发现返回日期是昨天：不能把过期结果作为今天的天气。'],['修正与重试','换一种查询方式，只重试一次；把失败原因写入记录。'],['完成或停止','核验通过后交付；仍失败就说明缺失信息，停止继续重试。']];
function harnessSlide(){return `<div class="harness-layout"><div><div class="loop-route">${loopSteps.map(([n],i)=>`<button data-loop="${i}"><span>0${i+1}</span>${n}</button>`).join('')}</div><div class="loop-stage">${svgWrap(`<path d="M90 220H725" stroke="#ccd2bf" stroke-width="3" stroke-dasharray="8 7"/><g id="loopRobot" transform="translate(90 65) scale(.65)">${robot(true)}</g>${icon('flag',720,120,.9)}<text x="720" y="180" text-anchor="middle" font-size="19" fill="#546b46">可核验的结果</text>`,'机器人沿目标、调用、核验、修正、停止的路线行动','0 0 820 245')}</div><div class="loop-caption" id="loopCopy" aria-live="polite"></div><div class="controls">${btn('下一步','loopNext',true)}${btn('播放流程','loopPlay')}${btn('重新演示','loopReset')}</div></div><aside class="harness-aside"><span class="label">把图中的术语放到例子里</span><h3>Goal · 目标设计</h3><p>做什么、怎样算完成、最多花多久。先写好验收条件。</p><h3>Loop / Graph · 循环与分支</h3><p>成功就交付，失败走修正分支；超出次数就停止。图结构把这些路径明确画出来。</p><div class="heartbeat-box"><span class="heartbeat-dot"></span><b>OpenClaw · 心跳机制</b><p>按配置定期唤起智能体，检查是否有需要处理的事；无事则保持安静。这是调度机制，不是“有生命”。</p></div></aside></div>${note('此处工具返回和失败是教学模拟。Harness 还可保存进度、恢复执行、限制权限与记录日志。Goal Engineering 是目标设计的说法，并非一个统一协议。')}`}
function initHarness(){let i=0,playing=false;const show=()=>{$$('[data-loop]').forEach((b,k)=>{b.classList.toggle('active',k===i);b.classList.toggle('done',k<i)});$('#loopRobot').setAttribute('transform',`translate(${90+i*132} 65) scale(.65)`);$('#loopCopy').innerHTML=`<strong>${loopSteps[i][0]}</strong><span>${loopSteps[i][1]}</span>`;$('#loopNext').disabled=i===4;$('#loopPlay').textContent=playing?'暂停流程':'播放流程'};$$('[data-loop]').forEach((b,k)=>b.onclick=()=>{i=k;playing=false;show()});$('#loopNext').onclick=()=>{i=Math.min(4,i+1);playing=false;show()};$('#loopPlay').onclick=()=>{if(i===4)i=0;playing=!playing;show()};$('#loopReset').onclick=()=>{i=0;playing=false;show()};every(()=>{if(playing){i=Math.min(4,i+1);if(i===4)playing=false;show()}},2400);show()}
function memorySlide(){return `<div class="memory-layout"><div><span class="label">Hermes · 把经验变成可以复用的方法</span><div class="skill-cycle">${[['完成任务','试出合适的图像压缩参数'],['提炼方法','记录步骤、参数和检查标准'],['保存 Skill','存入技能说明与相关资源'],['再次使用','先读方法，再按新任务调整']].map(([t,d],i)=>`<button data-memory="${i}"><span>0${i+1}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div><div class="memory-result" id="memoryResult"></div><p class="note">这里的“自进化”是更新技能与持久信息；不等于在后台自动训练模型权重。旧经验仍可能过期，需要核验。</p></div><div class="team-example">${svgWrap(`<g transform="translate(130 50) scale(.7)">${robot(true)}</g><g transform="translate(460 50) scale(.7)">${robot(true)}</g><path class="a2a-flow" d="M218 107H372m-12-9 12 9-12 9M372 151H218m12-9-12 9 12 9" fill="none" stroke="#b39361" stroke-width="4"/><text x="295" y="80" text-anchor="middle" font-size="24" fill="#546d43">A2A</text><text x="130" y="219" text-anchor="middle" font-size="19" fill="#546d43">制作 Agent</text><text x="460" y="219" text-anchor="middle" font-size="19" fill="#546d43">检查 Agent</text>`,'制作智能体与检查智能体交换任务和结果','0 0 590 248')}<h3>分工，也要交接和核验</h3><p>一个处理图片，另一个核对尺寸与清晰度。双方传递任务、状态与产物；分歧交给验收规则或人处理。</p></div></div><div class="protocol-strip">${[['MCP','连接工具与上下文'],['A2A','智能体之间协作'],['GUI','操作图形界面'],['CLI','执行命令行指令']].map(([n,d])=>`<div><b>${n}</b><span>${d}</span></div>`).join('')}</div>${note('MCP / A2A 是协议；GUI / CLI 是交互方式。多智能体也可以用其他方式协作，不必使用 A2A。记忆管理需筛选、更新和删除，不能把每次输出都当成正确经验。')}`}
function initMemory(){let p=0;const descriptions=['完成一次任务，只是起点。先检查图片是否真的符合要求。','提炼可复用步骤：备份原图 → 调整尺寸 → 压缩 → 检查清晰度。','Hermes 可通过技能管理工具创建或更新 Skill，保留方法供后续任务读取。','使用新图片验证方法；失败就修订技能，不盲目沿用旧经验。'];const pick=i=>{p=i;$$('[data-memory]').forEach((b,k)=>b.classList.toggle('active',i===k));$('#memoryResult').innerHTML=`<span class="memory-pulse">${i+1}</span><p>${descriptions[i]}</p>`};hoverSelect('[data-memory]',pick);every(()=>pick((p+1)%4),4200);pick(0)}

titleData[24]=['让 Agent 更有效：从要求到运行机制','提示词工程 → 上下文工程 → Harness Engineering'];

NOTES[5]='【第三版课堂提示】来源分布选择有公开分项体积的 GPT-J、GPT-NeoX、LLaMA，按年份排列。前两个共用 The Pile，图中是语料池选定来源，不是各自训练读取总量。Pile 原单位 GiB，换算 GB。参数量、训练量另列，避免 GB、Token、参数三种概念混用。所有数字可在本页数值表和资料中的原始论文核对。';
NOTES[24]='【第三版课堂提示】Prompt 关心怎么表达，Context 关心给什么信息，Harness 关心如何让整个执行系统可靠运转。三者互补。推理、流程、工具记忆、多智能体四个方向都要在真实任务上评估，比较质量、时延、成本。';
slides.splice(6,0,emergenceSlide);titleData.splice(6,0,['为什么会看起来“突然变聪明”？','模型大小 × 训练量：持续积累，也要看我们怎样评分。']);NOTES.splice(6,0,'【第三版课堂提示】先单独增加模型大小，再增加训练量，观察配合。滑块和曲线为虚构教学示意，不是模型实测拟合。门槛评分把连续变化压成通过/未通过。涌现研究对任务和指标敏感，没有通用阈值，更不能等同于意识。Chinchilla 说明固定计算预算下更大的模型并不必然最好。');
slides.splice(26,0,harnessSlide,memorySlide);titleData.splice(26,0,['让执行有反馈，也有终点','目标、循环、分支、核验：给智能体一套可靠的工作机制。'],['让经验留下来，让智能体协作','Skill 与记忆保存方法；多智能体交换任务与结果。']);NOTES.splice(26,0,'【第三版课堂提示】用天气简报展示执行、发现过期数据、重试、核验、停止。心跳是定期调度，不是模型生命或独立意识。Loop 指循环，Graph 可描述分支与状态转换；运行机制还负责日志、权限、预算和恢复。','【第三版课堂提示】Hermes 的技能更新是程序性记忆，不是自动修改模型权重。更新前核验，复用时重新检查。A2A 用于跨智能体协作，MCP 连接外部能力，两者可以共存；GUI、CLI是操作方式。多个智能体不保证比一个更好。');
